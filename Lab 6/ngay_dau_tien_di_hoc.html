<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Trang web dau tien - Tiếng Việt có dấu</title>
    <style>
        body {
            background-color: #faf2e4;
            font-family: sans-serif;
            margin: 40px;
        }
        h1 {
            text-align: center;
            font-family: serif;
            color: #d1633c;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
        }
        .signature {
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>NGÀY ĐẦU TIÊN ĐI HỌC</h1>
    <hr>
    <p>Ngày đầu tiên đi học</p>
    <p>Mẹ dắt tay đến trường</p>
    <p>Em vừa đi vừa khóc</p>
    <p>Mẹ dỗ dành bên em</p>
    <p class="signature">Tác giả: <em>Viễn Phương</em></p>
</body>
</html>
