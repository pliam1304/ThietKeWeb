<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Đăng ký nhận tin - Thực hành Lab 17</title>
</head>
<body>
    <h1>Đăng ký nhận tin</h1>
    <form action="#" method="post">
        <fieldset>
            <legend>Gửi thông tin của bạn cho chúng tôi</legend>
            <p>Đăng ký để nhận được các thông tin định kì về giá nông sản</p>
            <ol>
                <li>
                    <label for="ho-ten">Tên:</label>
                    <input type="text" name="ten" id="ho-ten">
                </li>
                <li>
                    <label for="email">Email:</label>
                    <input type="text" name="email" id="email">
                </li>
            </ol>
            <input type="submit" value="Đăng ký">
        </fieldset>
    </form>

    <h2>Ví dụ ô nhập nhận xét nhiều dòng (textarea)</h2>
    <form action="#" method="post">
        <textarea name="nhan-xet" rows="4" cols="45" placeholder="Để lại nhận xét của bạn tại đây!"></textarea>
        <br>
        <input type="submit" value="Gửi nhận xét">
    </form>

    <p><em>Sinh viên thực hiện: Huỳnh Phúc Lâm - Lớp CTK48B - MSSV: 2411869</em></p>
</body>
</html>
